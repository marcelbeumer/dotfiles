# #14161B is neovim's NvimDarkGrey2 (default Normal bg). Kitty only applies
# background_opacity to cells matching the default background, so using the
# exact same value makes neovim transparent. #141618 is one shade off —
# invisible difference, but kitty treats neovim's bg as explicit → opaque.
foreground #c5c8c6
background #141618

inactive_border_color #222
active_border_color #666
tab_bar_style powerline
hide_window_decorations yes
enable_audio_bell no

# font_family CaskaydiaCove Nerd Font
font_family JetBrainsMono Nerd Font
font_size   12
modify_font  cell_width 95%

# ANSI palette matching alacritty's built-in defaults
color0  #1d1f21
color1  #cc6666
color2  #b5bd68
color3  #f0c674
color4  #81a2be
color5  #b294bb
color6  #8abeb7
color7  #c5c8c6
color8  #666666
color9  #d54e53
color10 #b9ca4a
color11 #e7c547
color12 #7aa6da
color13 #c397d8
color14 #70c0b1
color15 #eaeaea

enabled_layouts tall,stack,fat,grid

map shift+enter send_text all \x1b[13;2u
map cmd+shift+enter toggle_layout stack
map cmd+enter launch --cwd=current
map cmd+] next_window
map cmd+[ previous_window
map cmd+alt+] move_window_forward
map cmd+alt+[ move_window_backward
map cmd+w close_window
